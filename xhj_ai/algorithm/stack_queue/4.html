<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 创建了一个空对象
        // Object 是顶层对象
        // Object.prototype 是原型对象
        // 所有对象的原型都是 Object.prototype 一个对象
    // const zzd = new Object();
    // console.log(zzd);
    function Person(name,age) {
        // 构造实例的，实例私有的
        console.log(this);
        this.name = name;
        this.age = age;
    }
    // 原型对象上的方法是公用的
    Person.prototype.poem = '仁义礼智信';
    // Person 的原型对象
    Person.prototype.say = function() {
        console.log(`我叫${this.name}，很高兴认识你`);
    }
    Person.prototype.timeMF = function() {
        console.log(`时间管理技能`);
    }
    const wxf = new Person('吴小帆',18);
    console.log(wxf.toString());
    </script> 
</body>
</html>
