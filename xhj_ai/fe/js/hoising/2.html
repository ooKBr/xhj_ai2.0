<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // var myName = 'xhj'; 可以看成由声明和赋值两部分组成 var myName=undefined; myName = 'xhj';
        var myName;
        myName = 'xhj';
        // 完整的函数声明，没有涉及赋值操作
        function foo() {
            console.log('foo');
        }
        // 函数表达式，涉及赋值操作
        var bar = function() {
            console.log('bar');
        }
    </script>
</body>
</html>
