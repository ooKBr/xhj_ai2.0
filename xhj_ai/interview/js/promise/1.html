<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // const streetCarsPromise = fetch('http://data.ratp.fr/api/datasets/1.0/search/?q=paris')
        // console.log(streetCarsPromise);
        const getStory = async () => 
            fetch('https://v1.hitokoto.cn/?c=i&encode=json')
        const getRatp = async () =>
            fetch('https://api.1314.cool/bingimg/?type=json&rand=1')
        async function main() {
            // 不存在依赖关系的时候，可以并行执行 Promise 一系列静态方法
            // const story = await getStory();
            // const ratp = await getRatp();
            // 并发的效果
            // .all 里传递的参数是promise 数组
            // 不管谁先解决，谁后，resolve 的结果会按promise 数组的顺序来收集。最后一个promise resolved 之后，停下来
              Promise.all([getStory(), getRatp()])
              .then(response => {
                return Promise.all(response.map(res => res.json()))
              })
              .catch(response => {
                console.log(response);
              })
            //   console.log(res);
            //   const jsonPromise = res.map(item => item.json());
            //   const result = await Promise.all(jsonPromise);
            //   console.log(result);
        
        }
        main()
    </script>
</body>
</html>
